name: Lembrete Diário da Agenda

on:
  schedule:
    # 12:00 UTC = 09:00 no horário de Brasília (UTC-3, sem horário de verão)
    - cron: '0 12 * * *'
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions, pra testar

jobs:
  enviar-lembrete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar script de lembretes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/enviar-lembretes.js
